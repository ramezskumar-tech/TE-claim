<style>
  :root {
    --supabase-bg-url: url('https://uaytprvluhpwgbunzsbd.supabase.co/storage/v1/object/public/background/bck.jpg');
    --bg-canvas: #0f172a;
    --bg-surface: rgba(255, 255, 255, 0.88);
    --border-hairline: rgba(255, 255, 255, 0.4);
    --text-primary: #0F172A;
    --text-muted: #64748B;
    --accent-emerald: #059669;
    --accent-blue: #1D4ED8;
    --accent-amber: #D97706;
    --accent-red: #DC2626;
    --glow-emerald: 0 0 18px rgba(5, 150, 105, 0.35);
    --glow-amber: 0 0 18px rgba(217, 119, 6, 0.4);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-full: 9999px;
    --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background-color: var(--bg-canvas);
    background-image: var(--supabase-bg-url), radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.25) 0px, transparent 50%);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text-primary);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Fallback for older browsers without backdrop-filter support */
  @supports not (backdrop-filter: blur(14px)) {
    body { background-color: #f1f5f9; background-image: none; }
    .data-card, .stat-card, .modal-content { background: #ffffff !important; }
  }

  /* 3-Zone Top Navigation Contract (Windows 11 Acrylic) */
  .top-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    padding: 0 24px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: #F8FAFC;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  }
  .nav-brand { display: flex; align-items: center; gap: 12px; }
  .nav-brand .emblem { font-size: 24px; }
  .nav-brand h1 { font-size: 16px; font-weight: 700; color: #FFFFFF; }
  .nav-brand p { font-size: 11px; color: #94A3B8; }
  
  .nav-cycle-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1E293B;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 13px;
    border: 1px solid #334155;
  }
  .cycle-label { color: #94A3B8; }
  .cycle-period { color: #CBD5E1; font-size: 12px; }

  .nav-user-actions { display: flex; align-items: center; gap: 12px; }
  .user-badge { text-align: right; }
  .user-role-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    background: #059669;
    color: #FFFFFF;
    border-radius: 4px;
    margin-right: 6px;
  }
  .user-name { font-size: 13px; font-weight: 600; color: #F1F5F9; }

  /* Main Viewport */
  .main-container {
    max-width: 1400px;
    margin: 20px auto;
    padding: 0 20px 40px;
  }

  /* Glowing Notification Alerts */
  .glowing-alert {
    padding: 14px 18px;
    border-radius: var(--radius-md);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
  }
  .glow-return {
    background: #FFFBEB;
    border: 1.5px solid #F59E0B;
    color: #92400E;
    box-shadow: var(--glow-amber);
    animation: pulseGlow 2.5s infinite;
  }
  .glow-approved {
    background: #ECFDF5;
    border: 1.5px solid #10B981;
    color: #065F46;
    box-shadow: var(--glow-emerald);
  }
  .glow-submitted {
    background: #EFF6FF;
    border: 1.5px solid #3B82F6;
    color: #1E40AF;
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
  }

  /* Two Chasing Glowing Lines Animation (Blue -> Orange -> Red) */
  @keyframes borderChaser {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .animated-chaser-line {
    position: absolute;
    top: -60%;
    left: -60%;
    width: 220%;
    height: 220%;
    background: conic-gradient(
      from 0deg at 50% 50%,
      transparent 0deg,
      #3b82f6 35deg,
      #f97316 65deg,
      #ef4444 85deg,
      transparent 90deg,
      transparent 180deg,
      #3b82f6 215deg,
      #f97316 245deg,
      #ef4444 265deg,
      transparent 270deg,
      transparent 360deg
    );
    animation: borderChaser 4s linear infinite;
    filter: blur(1.5px) drop-shadow(0 0 10px rgba(249, 115, 22, 0.9));
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 12px rgba(217, 119, 6, 0.25); }
    50% { box-shadow: 0 0 20px rgba(217, 119, 6, 0.45); }
  }

  /* Navigation Tabs */
  .view-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border-hairline);
    margin-bottom: 24px;
    padding-bottom: 2px;
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active {
    color: var(--accent-blue);
    border-bottom-color: var(--accent-blue);
  }

  .view-panel { display: none; }
  .view-panel.active { display: block; }

  /* Dashboard Cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-md);
    padding: 18px;
  }
  .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .stat-val { font-size: 26px; font-weight: 700; color: var(--text-primary); font-family: var(--font-mono); margin-top: 4px; }

  /* Data Table */
  .data-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .card-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-hairline);
  }
  .card-header-bar h2 { font-size: 16px; font-weight: 700; }
  
  table.claim-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.claim-table th {
    background: #F1F5F9;
    text-align: left;
    padding: 12px 16px;
    font-weight: 600;
    color: #475569;
    border-bottom: 1px solid var(--border-hairline);
  }
  table.claim-table td {
    padding: 12px 16px;
    border-bottom: 1px solid #F1F5F9;
    vertical-align: middle;
  }
  table.claim-table tr:hover { background: #F8FAFC; }
  .tabular { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .btn-primary { background: #0F172A; color: #FFFFFF; }
  .btn-primary:hover { background: #1E293B; }
  .btn-success { background: #059669; color: #FFFFFF; }
  .btn-success:hover { background: #047857; }
  .btn-danger { background: #DC2626; color: #FFFFFF; }
  .btn-danger:hover { background: #B91C1C; }
  .btn-outline { background: transparent; border: 1px solid #CBD5E1; color: #334155; }
  .btn-outline:hover { background: #F1F5F9; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.hidden { display: none; }
  .modal-content {
    background: #FFFFFF;
    width: 90%;
    max-width: 800px;
    max-height: 90vh;
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
  }
  .modal-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
  .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border-hairline); display: flex; justify-content: flex-end; gap: 10px; background: #F8FAFC; }
</style>
