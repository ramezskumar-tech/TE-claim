<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 240" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Navy Background Gradient -->
    <radialGradient id="bgGlow" cx="58%" cy="42%" r="65%" fx="58%" fy="42%">
      <stop offset="0%" stop-color="#0e2a94" />
      <stop offset="35%" stop-color="#071966" />
      <stop offset="70%" stop-color="#030c45" />
      <stop offset="100%" stop-color="#010626" />
    </radialGradient>
    
    <!-- Linear Gradient for Wave System 1 (Cyan to Royal Blue to Electric Sky) -->
    <linearGradient id="waveGradCyan" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="18%" stop-color="#00d2ff" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.3" />
    </linearGradient>

    <!-- Linear Gradient for Wave System 2 (Luminous Electric Blue to Deep Azure) -->
    <linearGradient id="waveGradElectric" x1="0%" y1="80%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Linear Gradient for Wave System 3 (Subtle Base Foundation) -->
    <linearGradient id="waveGradBase" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- Subtle glow filter -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

